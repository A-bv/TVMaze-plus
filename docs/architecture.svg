  <text class="edge-label" x="906" y="290">delete</text>
  <path class="edge" d="M970,450 V212" marker-end="url(#arrow)"/>
  <text class="edge-label" x="976" y="290">@Query</text>

  <path class="edge" d="M225,110 V148" marker-end="url(#arrow)"/>
  <text class="edge-label" x="231" y="133">tab</text>
  <path class="edge" d="M935,110 V148" marker-end="url(#arrow)"/>
  <text class="edge-label" x="941" y="133">tab</text>
  <path class="edge" d="M1020,80 H1048 V480 H1022" marker-end="url(#arrow)"/>
  <text class="edge-label" x="1056" y="280" transform="rotate(90 1056 280)" text-anchor="middle">container</text>

  <rect class="box protocol" x="140" y="538" width="34" height="18" rx="5"/>
  <text class="role" x="184" y="552">Behind a protocol, replaced by a mock in unit tests</text>
</svg>
