<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 630" width="1010" height="630" role="img" aria-labelledby="title desc">
  <title id="title">TVMazeApp architecture</title>
  <desc id="desc">The App (@main) shows the tab bar and creates the SwiftData store. The tab bar, a TabView, has one tab per feature. In a feature, here search: the main view sends the search to the ViewModel and gets its state back, and opens the detail view with a NavigationLink. The ViewModel fetches from the service and gets networking models back, then passes them to the Transformer and gets domain models back. The service calls the TVmaze API over HTTPS with URLSession, behind the DataSession protocol that tests replace with a fake. Favorites: the favorite button, on the main and detail views, and the favorite list save, delete and read favorites directly in SwiftData, the persistence layer, at the same level as networking.</desc>
  <style>
    .band { fill: #f6f8fa; }
    .box { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
    .protocol { stroke-dasharray: 6 4; }
    .accent { stroke: #0969da; stroke-width: 2; }
    .legend { fill: none; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .type { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .role { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .layer { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0969da; letter-spacing: 0.08em; }
    .column { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .edge { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .edge-label { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #59636e; }
    .arrowhead { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .band { fill: #151b23; }
      .box { fill: #0d1117; stroke: #9198a1; }
      .accent { stroke: #4493f8; }
      .legend { stroke: #9198a1; }
      .type { fill: #f0f6fc; }
      .role, .edge-label { fill: #9198a1; }
      .layer { fill: #4493f8; }
      .column { fill: #9198a1; }
      .edge { stroke: #9198a1; }
      .arrowhead { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="box" x="20" y="16" width="960" height="56" rx="10"/>
  <text class="type" x="500" y="40" text-anchor="middle">App</text>
  <text class="role" x="500" y="60" text-anchor="middle">@main · shows the tab bar · creates the SwiftData store</text>
  <text class="layer" x="964" y="36" text-anchor="end">ENTRY POINT</text>

  <rect class="band" x="20" y="96" width="960" height="210" rx="12"/>
  <text class="layer" x="964" y="120" text-anchor="end">UI · VIEWS</text>

  <rect class="box" x="40" y="134" width="920" height="46" rx="10"/>
  <text class="type" x="500" y="153" text-anchor="middle">Tab bar</text>
  <text class="role" x="500" y="171" text-anchor="middle">TabView · one tab per feature</text>
  <path class="edge" d="M500,72 V132" marker-end="url(#arrow)"/>

  <text class="column" x="310" y="210" text-anchor="middle">Feature (e.g. search)</text>
  <text class="column" x="806" y="210" text-anchor="middle">Favorites</text>

  <rect class="box" x="40" y="222" width="190" height="54" rx="10"/>
  <text class="type" x="135" y="245" text-anchor="middle">Main view</text>
  <text class="role" x="135" y="264" text-anchor="middle">feature screen</text>

  <rect class="box" x="390" y="222" width="190" height="54" rx="10"/>
  <text class="type" x="485" y="245" text-anchor="middle">Detail view</text>
  <text class="role" x="485" y="264" text-anchor="middle">one item</text>

  <rect class="box" x="640" y="222" width="160" height="54" rx="10"/>
  <text class="type" x="720" y="245" text-anchor="middle">Favorite button</text>
  <text class="role" x="720" y="264" text-anchor="middle">on main and detail</text>

  <rect class="box" x="812" y="222" width="160" height="54" rx="10"/>
  <text class="type" x="892" y="245" text-anchor="middle">Favorite list</text>
  <text class="role" x="892" y="264" text-anchor="middle">Favorites tab</text>

  <path class="edge" d="M135,180 V220" marker-end="url(#arrow)"/>
  <path class="edge" d="M892,180 V220" marker-end="url(#arrow)"/>

  <path class="edge" d="M230,249 H388" marker-end="url(#arrow)"/>
  <text class="edge-label" x="310" y="241" text-anchor="middle">NavigationLink</text>

  <rect class="band" x="20" y="326" width="580" height="100" rx="12"/>
