<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 570" width="1080" height="570" role="img" aria-labelledby="title desc">
  <title id="title">TVMazeApp architecture</title>
  <desc id="desc">App: shows the Search and Favorites tabs and gives the SwiftData container to every view. UI: the search screen owns the ViewModel, sends it the search and renders its state; tapping a card opens the show detail; the heart button sits on every card and on the detail; the Favorites tab lists saved shows. ViewModel: fetches API models from the API service and passes them to the transformer, which fills the display models. Networking: the API service sends a GET through a network session to the TVMaze API and decodes the JSON. Persistence: the heart button inserts or deletes favorites and the Favorites tab deletes them, both reading SwiftData with @Query.</desc>
  <style>
    .band { fill: #f6f8fa; }
    .box { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
    .protocol { stroke-dasharray: 6 4; }
    .accent { stroke: #0969da; stroke-width: 2; }
    .type { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .role { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .row { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; letter-spacing: 0.08em; }
    .edge { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .edge-label { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #59636e; }
    .arrowhead { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .band { fill: #151b23; }
      .box { fill: #0d1117; stroke: #9198a1; }
      .accent { stroke: #4493f8; }
      .type { fill: #f0f6fc; }
      .role, .row, .edge-label { fill: #9198a1; }
      .edge { stroke: #9198a1; }
      .arrowhead { fill: #9198a1; }
    }
  </style>
  <defs>
