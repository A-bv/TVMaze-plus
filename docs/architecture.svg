  <rect class="box accent" x="40" y="354" width="190" height="54" rx="10"/>
  <text class="type" x="135" y="377" text-anchor="middle">ViewModel</text>
  <text class="role" x="135" y="396" text-anchor="middle">@Observable state</text>

  <rect class="box" x="390" y="354" width="190" height="54" rx="10"/>
  <text class="type" x="485" y="377" text-anchor="middle">Transformer</text>
  <text class="role" x="485" y="396" text-anchor="middle">shapes data for the views</text>

  <path class="edge" d="M105,276 V352" marker-end="url(#arrow)"/>
  <text class="edge-label" x="99" y="318" text-anchor="end">search</text>
