  <text class="edge-label" x="171" y="318">state</text>

  <path class="edge" d="M230,370 H388" marker-end="url(#arrow)"/>
  <text class="edge-label" x="310" y="362" text-anchor="middle">networking models</text>
  <path class="edge" d="M390,394 H232" marker-end="url(#arrow)"/>
  <text class="edge-label" x="310" y="408" text-anchor="middle">domain models</text>

  <rect class="band" x="20" y="446" width="580" height="100" rx="12"/>
  <text class="layer" x="584" y="464" text-anchor="end">NETWORKING</text>

  <rect class="box protocol" x="40" y="474" width="190" height="54" rx="10"/>
  <text class="type" x="135" y="497" text-anchor="middle">Service</text>
  <text class="role" x="135" y="516" text-anchor="middle">decodes · typed errors</text>

  <rect class="box protocol" x="390" y="474" width="190" height="54" rx="10"/>
  <text class="type" x="485" y="497" text-anchor="middle">URLSession</text>
  <text class="role" x="485" y="516" text-anchor="middle">behind DataSession</text>

  <path class="edge" d="M105,408 V472" marker-end="url(#arrow)"/>
  <text class="edge-label" x="99" y="440" text-anchor="end">fetch</text>
  <path class="edge" d="M165,474 V410" marker-end="url(#arrow)"/>
  <text class="edge-label" x="171" y="440">networking models</text>

  <path class="edge" d="M230,490 H388" marker-end="url(#arrow)"/>
  <text class="edge-label" x="310" y="482" text-anchor="middle">GET</text>
  <path class="edge" d="M390,512 H232" marker-end="url(#arrow)"/>
  <text class="edge-label" x="310" y="526" text-anchor="middle">JSON</text>

  <rect class="box" x="390" y="572" width="190" height="46" rx="23"/>
  <text class="type" x="485" y="592" text-anchor="middle">TVmaze API</text>
  <text class="role" x="485" y="610" text-anchor="middle">api.tvmaze.com</text>
  <path class="edge" d="M485,530 V570" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="edge-label" x="497" y="555">HTTPS</text>

  <rect class="band" x="620" y="446" width="360" height="100" rx="12"/>
  <text class="layer" x="964" y="464" text-anchor="end">PERSISTENCE</text>

  <rect class="box accent" x="640" y="474" width="332" height="54" rx="10"/>
  <text class="type" x="806" y="497" text-anchor="middle">SwiftData</text>
  <text class="role" x="806" y="516" text-anchor="middle">@Model · stored on device</text>

  <path class="edge" d="M720,294 V278" marker-end="url(#arrow)"/>
  <path class="edge" d="M892,294 V278" marker-end="url(#arrow)"/>
  <path class="edge" d="M720,294 H892"/>
  <path class="edge" d="M760,294 V472" marker-end="url(#arrow)"/>
  <text class="edge-label" x="768" y="320">save · delete · @Query</text>

  <path class="edge" d="M980,44 H996 V501 H974" marker-end="url(#arrow)"/>

  <rect class="legend" x="640" y="572" width="34" height="18" rx="5"/>
  <text class="role" x="684" y="586">Behind a protocol,</text>
  <text class="role" x="684" y="604">replaced by a mock in tests</text>
</svg>
