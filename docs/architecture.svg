  <path class="edge" d="M690,210 V448" marker-end="url(#arrow)"/>
  <text class="edge-label" x="696" y="282">insert</text>
  <text class="edge-label" x="696" y="298">delete</text>
  <path class="edge" d="M760,450 V212" marker-end="url(#arrow)"/>
