  <text class="row" x="28" y="184">UI</text>
  <text class="row" x="28" y="284">VIEWMODEL</text>
  <text class="row" x="28" y="384">NETWORKING</text>
  <text class="row" x="28" y="484">PERSISTENCE</text>

