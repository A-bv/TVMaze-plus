<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="900" height="100" role="img" aria-labelledby="title desc">
  <title id="title">TVMazeApp models</title>
  <desc id="desc">The API model, decoded from the JSON, is transformed into the display model that every screen uses, which is copied into the stored model when a show is saved as a favorite.</desc>
  <style>
    .box { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
    .accent { stroke: #0969da; stroke-width: 2; }
    .type { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .role { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .edge { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .edge-label { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #59636e; }
    .arrowhead { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #0d1117; stroke: #9198a1; }
      .accent { stroke: #4493f8; }
      .type { fill: #f0f6fc; }
      .role, .edge-label { fill: #9198a1; }
      .edge { stroke: #9198a1; }
      .arrowhead { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="box" x="10" y="15" width="220" height="70" rx="10"/>
  <text class="type" x="120" y="44" text-anchor="middle">API model</text>
  <text class="role" x="120" y="67" text-anchor="middle">Decodable · mirrors the JSON</text>

  <rect class="box accent" x="340" y="15" width="220" height="70" rx="10"/>
  <text class="type" x="450" y="44" text-anchor="middle">Display model</text>
  <text class="role" x="450" y="67" text-anchor="middle">what every screen shows</text>

  <rect class="box" x="670" y="15" width="220" height="70" rx="10"/>
  <text class="type" x="780" y="44" text-anchor="middle">Stored model</text>
  <text class="role" x="780" y="67" text-anchor="middle">SwiftData @Model</text>

  <path class="edge" d="M230,50 H338" marker-end="url(#arrow)"/>
  <text class="edge-label" x="284" y="42" text-anchor="middle">transform</text>

  <path class="edge" d="M560,50 H668" marker-end="url(#arrow)"/>
  <text class="edge-label" x="614" y="42" text-anchor="middle">save</text>
</svg>
